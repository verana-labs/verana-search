apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "verana-search.fullname" . }}
  labels:
    {{- include "verana-search.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "verana-search.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "verana-search.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: verana-search
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GRAPH_BASE_URL
              value: {{ .Values.env.graphBaseUrl | quote }}
            - name: RESOLVER_BASE_URL
              value: {{ .Values.env.resolverBaseUrl | quote }}
            - name: NETWORK_LABEL
              value: {{ .Values.env.networkLabel | quote }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
